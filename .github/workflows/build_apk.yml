name: Build U Type APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Debug APK and copy to apk/LankaKeys.apk
        run: gradle :app:exportApk

      - name: Upload apk/LankaKeys.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: LankaKeys-APK
          path: apk/LankaKeys.apk
          retention-days: 30
